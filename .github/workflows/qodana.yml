name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # summary comment on the PR
      checks: write # inline annotations
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

    steps:
      # qodana-js is an Ultimate linter: it will not start without a Qodana Cloud
      # project token. Skip (instead of failing) until the secret exists, and on
      # Dependabot and fork PRs, which never get repository secrets.
      - name: Check for QODANA_TOKEN
        id: token
        run: |
          if [ -n "$QODANA_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::QODANA_TOKEN secret is not available, skipping the Qodana scan."
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          # PR mode diffs against the base branch, so it needs the PR head and full history.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana scan
        if: steps.token.outputs.present == 'true'
        uses: JetBrains/qodana-action@v2026.2
        with:
          cache-default-branch-only: true
