version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (peer typescript <6.1),
      # so npm ci fails. Remove once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      apollo-graphql:
        patterns:
          - "@apollo/*"
          - "graphql"
      vite-vitest:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
      testing:
        patterns:
          - "@testing-library/*"
          - "jsdom"
      lint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-*"
          - "globals"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
